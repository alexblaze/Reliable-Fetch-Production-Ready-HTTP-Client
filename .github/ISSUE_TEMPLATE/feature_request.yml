name: Feature request
description: Propose a change or addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem to solve }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      {
        label: Proposed API and semantics,
        description: "Include failure, cancellation and security behaviour.",
      }
